<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sheet1</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css"
      integrity="sha512-10/jx2EXwxxWqCLX/hHth/vu2KY3jCF70dCQB8TSgNjbCVAC/8vai53GfMDrO2Emgwccf2pJqxct9ehpzG+MTw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .center {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container-fluid {
        padding-right: 15px;
        padding-left: 15px;
        margin-right: auto;
        margin-left: auto;
      }
      #header {
        height: 100px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        gap: 10px;
      }
      #header img {
        height: 80px;
        margin-left: 0px;
      }
      #nav {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: white;
        color: black;
        padding: 10px;
      }
      ul {
        text-decoration: none;
        list-style: none;
      }
      ul li {
        display: inline;
      }
      a {
        padding: 30px;
      }
      h2 {
        color: #0e0342;
        font-weight: bold;
      }
      .custom-button {
        background-color: #f0f8ff;
        color: black;
        padding: 10px 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .custom-button:hover {
        background-color: #e0e8ff;
        color: #000;
      }

      .nav-tabs .nav-item .nav-link {
        color: black;
        border-radius: 15px;
        padding: 10px 20px;
        margin-right: 10px;
        font-weight: bold;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .nav-tabs .nav-item .nav-link.active {
        background-color: #3a285e;
        color: white;
      }

      .nav-tabs .nav-item .nav-link:hover {
        background-color: #4b386f;
        color: white;
      }

      .nav-tabs {
        border-bottom: none;
      }

      #aside {
        border-right: 2px solid #ccc;
      }

      #section {
        padding-left: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid p-4">
      <div id="header">
        <div id="header-left" style="display: flex; gap: 20px">
          <img src="/public/img/samsung.png" alt="Logo" />
          <div class="center"><h2>SHI Process Condition</h2></div>
        </div>
        <div id="header-right" style="display: flex; gap: 20px">
          <p>홍길동님 반갑습니다.</p>
          <button type="button" class="custom-button">로그아웃</button>
        </div>
      </div>

      <div id="nav" class="box">
        <ul class="nav nav-tabs">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#"
              >개정도 현황</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">설계 현황</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">생산설계</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">용접 현황</a>
          </li>
        </ul>
      </div>
      <div id="main" class="col-12">
        <div
          id="aside"
          class="col-2 d-flex flex-column justify-content-between m-4"
        >
          <div class="accordion accordion-flush" id="accordionFlushExample">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#flush-collapseOne"
                  aria-expanded="false"
                  aria-controls="flush-collapseOne"
                >
                  원인코드분석
                </button>
              </h2>
              <div
                id="flush-collapseOne"
                class="accordion-collapse collapse"
                data-bs-parent="#accordionFlushExample"
              >
                <div class="accordion-body">
                  <ul>
                    <li><a href="">현황1</a></li>
                    <li><a href="">현황2</a></li>
                    <li><a href="">현황3</a></li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#flush-collapseTwo"
                  aria-expanded="false"
                  aria-controls="flush-collapseTwo"
                >
                  설계변경 현황
                </button>
              </h2>
              <div
                id="flush-collapseTwo"
                class="accordion-collapse collapse"
                data-bs-parent="#accordionFlushExample"
              >
                <div class="accordion-body">
                  <ul>
                    <li><a href="">현황1</a></li>
                    <li><a href="">현황2</a></li>
                    <li><a href="">현황3</a></li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#flush-collapseThree"
                  aria-expanded="false"
                  aria-controls="flush-collapseThree"
                >
                  개정도 현황
                </button>
              </h2>
              <div
                id="flush-collapseThree"
                class="accordion-collapse collapse"
                data-bs-parent="#accordionFlushExample"
              >
                <div class="accordion-body">
                  <ul>
                    <li><a href="">현황1</a></li>
                    <li><a href="">현황2</a></li>
                    <li><a href="">현황3</a></li>
                  </ul>
                </div>
              </div>
            </div>
          </div>

          <div id="section" class="col-10"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-Rx+T1VzGupg4BHQYs2gCW9It+akI2MM/mndMCy36UVfodzcJcF0GGLxZIzObiEfa"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
